name: Schedule PlaywrightScriptPractice scripts with Allure Report

# Runs every day at 10:00 PM IST
# 10:00 PM IST = 4:30 PM UTC

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get previous Allure history
        run: |
          echo "Checking previous Allure report structure..."

          git fetch origin gh-pages || true

          git ls-tree -r origin/gh-pages --name-only | grep "script-practice/history" || true

          git checkout origin/gh-pages -- script-practice/history || true

          if [ -d "script-practice/history" ]; then
            echo "Previous history found!"
            mkdir -p allure-history
            cp -r script-practice/history/* allure-history/
            echo "History files copied:"
            ls -la allure-history
          else
            echo "No previous history found."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Playwright browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Clean Allure Results
        run: rm -rf allure-results

      - name: Run Complete PlaywrightScriptPractice Tests
        run: mvn test -Dtest=PlaywrightScriptPractice.**
        continue-on-error: true

      - name: Copy previous Allure history
        run: |
          if [ -d "allure-history" ]; then
            mkdir -p allure-results/history
            cp -r allure-history/* allure-results/history/
            echo "History copied to allure-results/history:"
            ls -la allure-results/history
          else
            echo "No history available to copy."
          fi

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Deploy PlaywrightScriptPractice Allure Report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
          destination_dir: script-practice
          keep_files: true
          full_commit_message: "Update PlaywrightScriptPractice Allure Report with history"
