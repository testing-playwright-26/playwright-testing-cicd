name: Schedule PlaywrightScriptPractice scripts with Allure Report

# Runs every day at 10:00 PM IST
# 10:00 PM IST - 5 hours 30 minutes = 4:30 PM UTC

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Playwright browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Clean Allure Results
        run: rm -rf allure-results

      - name: Run Complete PlaywrightScriptPractice Tests
        run: mvn test -Dtest=PlaywrightScriptPractice.**
        continue-on-error: true

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Allure Report to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy:
    needs: run-playwright-tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
