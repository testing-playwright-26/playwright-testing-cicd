name: Schedule Login Test with Allure Report

# Runs every day at 3:00 PM IST
# 3:00 PM IST = 9:30 AM UTC

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Playwright browsers
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

      - name: Clean Allure Results
        run: rm -rf allure-results

      - name: Run LoginTest
        run: mvn test -Dtest=LoginTest

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Deploy LoginTest Allure Report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
          destination_dir: login-test
          keep_files: true
          full_commit_message: "Update LoginTest workflow for separate Allure report"
